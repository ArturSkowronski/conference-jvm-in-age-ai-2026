name: TornadoVM Version Comparison

on:
  push:
    paths:
      - 'demos/tornadovm/**'
      - 'demos/tornadovm-3/**'
      - 'demos/tornadovm-4/**'
      - '.github/workflows/tornadovm-comparison.yml'
  pull_request:
    paths:
      - 'demos/tornadovm/**'
      - 'demos/tornadovm-3/**'
      - 'demos/tornadovm-4/**'
      - '.github/workflows/tornadovm-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tornadovm-comparison-${{ github.ref }}
  cancel-in-progress: true

env:
  VECTOR_SIZE: "1000000"
  VECTOR_ITERS: "5"
  JVMCI_CONFIG_CHECK: "ignore"

jobs:
  # ── TornadoVM 2.2.0 (JDK 21 + OpenCL) ──────────────────────────────
  tornadovm-220:
    name: TornadoVM 2.2.0 (JDK 21 / OpenCL)
    runs-on: ubuntu-latest
    env:
      TORNADOVM_VERSION: "2.2.0"
      TORNADOVM_BACKEND: "opencl"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install OpenCL CPU Runtime (Intel oneAPI)
        run: |
          wget -q https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB -O /tmp/intel-gpg.pub
          sudo gpg --yes --dearmor --output /usr/share/keyrings/oneapi-archive-keyring.gpg /tmp/intel-gpg.pub
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y intel-oneapi-runtime-opencl ocl-icd-libopencl1 clinfo
          echo "--- OpenCL devices ---"
          clinfo --list || true

      - name: Download TornadoVM 2.2.0 SDK
        run: |
          filename="tornadovm-${TORNADOVM_VERSION}-${TORNADOVM_BACKEND}-linux-amd64.tar.gz"
          url="https://github.com/beehive-lab/TornadoVM/releases/download/v${TORNADOVM_VERSION}/${filename}"
          echo "Downloading: ${url}"
          curl -fL "${url}" -o "/tmp/${filename}"
          mkdir -p "${RUNNER_TEMP}/tornadovm"
          tar -xzf "/tmp/${filename}" -C "${RUNNER_TEMP}/tornadovm"
          TORNADO_SDK="$(find "${RUNNER_TEMP}/tornadovm" -maxdepth 1 -type d -name 'tornadovm-*' -print -quit)"
          echo "TORNADOVM_HOME=${TORNADO_SDK}" >> "${GITHUB_ENV}"
          echo "Installed: ${TORNADO_SDK}"

      - name: Compile VectorAdd demo
        run: |
          build_dir="build/tornado-ci-220"
          src_dir="demos/tornadovm/src/tornado/java"
          mkdir -p "${build_dir}/mods"
          find "${src_dir}" -name "*.java" > "${build_dir}/sources.txt"
          tornado_jars="$(find "${TORNADOVM_HOME}" -name '*.jar' -print0 | tr '\0' ':')"
          javac --enable-preview --release 21 \
                --module-path "${tornado_jars}" \
                -d "${build_dir}/mods/demo.tornadovm" \
                @"${build_dir}/sources.txt"
          echo "BUILD_DIR=${build_dir}" >> "${GITHUB_ENV}"

      - name: Run VectorAdd benchmark
        continue-on-error: true
        run: |
          tornado_jars="$(find "${TORNADOVM_HOME}" -name '*.jar' -print0 | tr '\0' ':')"
          java --enable-preview \
               --module-path "${tornado_jars}:${BUILD_DIR}/mods" \
               --add-modules ALL-MODULE-PATH \
               -m demo.tornadovm/demo.tornadovm.VectorAddTornado \
               --size ${VECTOR_SIZE} --iters ${VECTOR_ITERS} --warmup 2 \
            | tee /tmp/result-220.txt

      - name: Run CPU baseline
        run: |
          chmod +x demos/tornadovm/scripts/run-baseline.sh
          demos/tornadovm/scripts/run-baseline.sh \
            --size ${VECTOR_SIZE} --iters ${VECTOR_ITERS} --warmup 2 \
            | tee /tmp/baseline-220.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-220
          path: /tmp/result-220.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload baseline
        uses: actions/upload-artifact@v4
        with:
          name: baseline-220
          path: /tmp/baseline-220.txt
          retention-days: 7
          if-no-files-found: ignore

